plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// GitHub Actions 실행 번호를 버전으로 사용 → 올릴 때마다 자동 증가
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.joassam.hud'
    compileSdk 35

    defaultConfig {
        applicationId "com.joassam.hud"
        minSdk 29
        targetSdk 34
        versionCode runNumber
        versionName "1." + runNumber
    }

    // 항상 같은 키로 서명해야 덮어쓰기 업데이트가 됨
    signingConfigs {
        joa {
            storeFile file("joahud.keystore")
            storePassword "joahud123"
            keyAlias "joahud"
            keyPassword "joahud123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.joa
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.joa
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.tmapmobility.tmap:tmap-edc-sdk:1.0.0.0051'
}
